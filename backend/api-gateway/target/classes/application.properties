spring.application.name=api-gateway
server.port=${SERVER_PORT:8090}
spring.threads.virtual.enabled=true
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
store.services.product-url=${PRODUCT_SERVICE_URL:http://localhost:8091}
store.services.order-url=${ORDER_SERVICE_URL:http://localhost:8092}
account.jwt.secret=${JWT_SECRET:enterprise-store-local-secret-change-in-production}
