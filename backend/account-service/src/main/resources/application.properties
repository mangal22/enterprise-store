spring.application.name=account-service
server.port=${SERVER_PORT:8093}
spring.threads.virtual.enabled=true
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/enterprise_store_db}
account.jwt.secret=${JWT_SECRET:enterprise-store-local-secret-change-in-production}
account.jwt.ttl-seconds=${JWT_TTL_SECONDS:3600}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
