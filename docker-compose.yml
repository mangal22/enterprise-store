name: enterprise-store

services:
  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-enterprise_store_db}
    volumes:
      - mongodb-data:/data/db
    ports:
      - "${MONGO_PORT:-27017}:27017"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  account-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args: { MODULE: account-service }
    restart: unless-stopped
    environment:
      SERVER_PORT: 8093
      MONGODB_URI: mongodb://mongodb:27017/${MONGO_DATABASE:-enterprise_store_db}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-3600}
    ports: ["8093:8093"]
    depends_on:
      mongodb: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8093/actuator/health/readiness | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 10

  product-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args: { MODULE: product-service }
    restart: unless-stopped
    environment:
      SERVER_PORT: 8091
      MONGODB_URI: mongodb://mongodb:27017/${MONGO_DATABASE:-enterprise_store_db}
    ports: ["8091:8091"]
    depends_on:
      mongodb: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8091/actuator/health/readiness | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 10

  order-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args: { MODULE: order-service }
    restart: unless-stopped
    environment:
      SERVER_PORT: 8092
      MONGODB_URI: mongodb://mongodb:27017/${MONGO_DATABASE:-enterprise_store_db}
    ports: ["8092:8092"]
    depends_on:
      mongodb: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8092/actuator/health/readiness | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports: ["${FRONTEND_PORT:-4200}:80"]
    depends_on:
      account-service: { condition: service_healthy }
      product-service: { condition: service_healthy }
      order-service: { condition: service_healthy }

volumes:
  mongodb-data:
